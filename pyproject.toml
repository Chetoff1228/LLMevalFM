[tool.poetry]
name = "llmevalfm"
version = "0.1.0"
description = "Benchmark for evaluating the factual accuracy of LLMs in the Russian context."
authors = ["Chetvergov"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
black = "^24.10.0"
ruff = "^0.8.0"
pre-commit = "^4.0.1"
pandas = "^2.2.3"
numpy = "^2.1.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']


[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
ignore = ["E501"]
